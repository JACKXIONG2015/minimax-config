logLevel: info
provider:
  minimax:
    name: MiniMax
    npm: '@ai-sdk/anthropic'
    options:
      authMode: managed-login
      # apiKey 由 local-runtime.auth.json 提供（managed-login 模式），不要在仓库里写实际 key
      apiKey: ""
      baseURL: https://agent.minimaxi.com/mavis/api/v1/llm/v1
    models:
      MiniMax-M3:
        name: MiniMax-M3
        attachment: true
        reasoning: true
        tool_call: true
        temperature: true
        modalities:
          input:
            - text
            - image
            - video
          output:
            - text
        limit:
          context: 400000
          output: 128000
        options:
          reasoningSummary: auto
        thinking_config:
          mode: switchable
          default_value: 'true'
        variants:
          none-thinking:
            thinking:
              type: disabled
          thinking:
            thinking:
              type: adaptive
      MiniMax-M2.7-highspeed:
        name: MiniMax-M2.7-highspeed
        attachment: false
        reasoning: true
        tool_call: true
        temperature: true
        modalities:
          input:
            - text
          output:
            - text
        limit:
          context: 200000
          output: 128000
      MiniMax-M2.7:
        name: MiniMax-M2.7
        attachment: false
        reasoning: true
        tool_call: true
        temperature: true
        modalities:
          input:
            - text
          output:
            - text
        limit:
          context: 200000
          output: 128000
defaultModel: minimax/MiniMax-M3
permissionMode: bypassPermissions
